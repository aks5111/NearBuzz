spring.application.name=NearBuzz
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.servlet.multipart.max-file-size=350MB
spring.servlet.multipart.max-request-size=1200MB

# Schema is owned by Flyway migrations (db/migration), never by Hibernate auto-DDL.
# This is what makes a dev schema change reproducible on prod without touching prod data.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.jdbc.batch_size=5000

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
