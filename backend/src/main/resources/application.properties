spring.application.name=NearBuzz
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# 10MB covers a single listing image with headroom; the media upload
# endpoint enforces an additional 8MB + image-type check on top of this.
# The old 350MB/1200MB values (inherited from a leftover config) let anyone
# hand the server an arbitrarily large request body before any of our own
# validation ran — a free memory/bandwidth DoS. Raise this only for a
# specific, deliberate bulk-upload feature, never as a blanket default.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Schema is owned by Flyway migrations (db/migration), never by Hibernate auto-DDL.
# This is what makes a dev schema change reproducible on prod without touching prod data.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.jdbc.batch_size=5000

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Never leak stack traces or exception class names in HTTP error bodies —
# GlobalExceptionHandler already returns clean messages for known errors,
# this is the fallback for anything unexpected.
server.error.include-stacktrace=never
server.error.include-exception=false
