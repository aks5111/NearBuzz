# Production. Password has NO default here on purpose — the process
# fails fast at startup if DB_PASSWORD isn't set in the environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://bts-db.cfq0um8gwadk.sa-east-1.rds.amazonaws.com:5432/nearbuzz}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=10000

spring.jpa.show-sql=false

# No defaults here on purpose — startup fails fast if these aren't set.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.seed.super-admin-email=${ADMIN_EMAIL}
app.seed.super-admin-password=${ADMIN_PASSWORD}

cloudinary.url=${CLOUDINARY_URL}

# No default — must be your real deployed frontend origin(s), comma-separated.
# A wildcard/localhost default here would let any site call the API with a
# stolen or phished token.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Behind a load balancer/reverse proxy (typical AWS ALB setup) so Spring
# sees the original scheme/host from X-Forwarded-* headers.
server.forward-headers-strategy=framework

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Optional — chat gracefully reports "not configured" if this is blank.
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}

# Optional — geocoding/places/directions gracefully no-op if this is blank.
geo.google-api-key=${GEO_GOOGLE_API_KEY:}
