# Production. Password has NO default here on purpose — the process
# fails fast at startup if DB_PASSWORD isn't set in the environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://bts-db.cfq0um8gwadk.sa-east-1.rds.amazonaws.com:5432/nearbuzz}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=10000

spring.jpa.show-sql=false
