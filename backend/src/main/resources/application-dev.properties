# Local developer machine. Real password comes from the gitignored
# application-local.properties (see application-local.properties.example).
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=jdbc:postgresql://localhost:5432/nearbuzz_dev
spring.datasource.username=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true

app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-please-0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.seed.super-admin-email=${ADMIN_EMAIL:admin@nearbuzz.com}
app.seed.super-admin-password=${ADMIN_PASSWORD:Admin@12345}

# cloudinary.url comes from the gitignored application-local.properties

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# Optional — chat gracefully reports "not configured" if this is blank.
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
